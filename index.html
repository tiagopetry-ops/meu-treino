<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f63"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Meu Treino</title>
<style>:root{--b:#173f63;--g:#1e6645;--bg:#f3f5f7;--l:#e1e5e9;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15202b}.app{max-width:760px;margin:auto;padding:14px 14px 85px}h1{margin:0}.muted{color:var(--m);font-size:13px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px;margin:12px 0}.badge{float:right;background:#e9f3ec;color:var(--g);padding:6px 10px;border-radius:99px;font-weight:800}.tabs,.sets,.actions{display:grid;gap:7px}.tabs{grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);padding:7px;z-index:5}.sets{grid-template-columns:repeat(3,1fr)}.actions{grid-template-columns:1fr 1fr}button,a.btn{min-height:45px;border:1px solid var(--l);background:#fff;border-radius:11px;font-weight:800;padding:8px;text-decoration:none;color:#15202b;display:flex;align-items:center;justify-content:center}.primary{background:var(--b);color:#fff}.done{background:#e8f1f7}.view{display:none}.view.active{display:block}.ex{font-weight:900;font-size:17px}.cue{background:#edf3f7;padding:9px;border-radius:10px;color:var(--m);font-size:13px;margin:8px 0}.load{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}.load input{min-height:44px;border:1px solid var(--l);border-radius:10px;padding:0 10px;font-size:16px}.saved{color:var(--g);font-size:12px;font-weight:800;margin-top:5px}.progress{height:9px;background:#ddd;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--b)}.clock{font-size:30px;font-weight:900}.restbar{position:fixed;left:12px;right:12px;bottom:67px;z-index:20;background:#173f63;color:#fff;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.restbar.show{display:flex}.restbar .rtime{font-size:24px;font-weight:900;min-width:72px}.restbar .rlabel{font-size:11px;opacity:.8}.restbar .rinfo{flex:1;min-width:0}.restbar button{min-height:40px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:6px 10px}.hist{padding:9px 0;border-bottom:1px solid var(--l)}.check{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check input{width:100%}@media(max-width:480px){.tabs button{font-size:11px}.check{grid-template-columns:1fr}}</style></head>
<body><div class="app"><span class="badge">v4</span><h1>Meu Treino</h1><div class="muted" id="date"></div>
<section id="today" class="view active"><div class="card"><div class="muted">TREINO DE HOJE</div><h2 id="suggest"></h2><div id="desc" class="muted"></div><div class="actions" style="margin-top:12px"><button class="primary" id="start">Iniciar / continuar</button><button id="swap">Trocar treino</button></div></div>
<div class="card"><b>Check-in de recuperação</b><div class="check"><label>Sono <span id="sv">8</span>/10<input id="sleep" type="range" min="0" max="10" value="8"></label><label>Energia <span id="ev">8</span>/10<input id="energy" type="range" min="0" max="10" value="8"></label><label>Dor articular <span id="pv">0</span>/10<input id="pain" type="range" min="0" max="10" value="0"></label><label>Rigidez <span id="rv">1</span>/10<input id="stiff" type="range" min="0" max="10" value="1"></label></div><div class="cue" id="advice">Condição adequada para o treino planejado.</div></div></section>
<section id="workout" class="view"><h2 id="wt"></h2><div class="muted" id="prog"></div><div class="progress"><span id="bar" style="width:0"></span></div><div id="cards"></div><button class="primary" id="finish" style="width:100%">Concluir treino</button></section>
<section id="history" class="view"><h2>Histórico</h2><div id="hist" class="card"></div></section>
<section id="evolution" class="view"><h2>Evolução</h2><div class="muted">Últimas cargas registradas.</div><div id="evo"></div></section></div>
<div id="restbar" class="restbar" aria-live="polite">
<div class="rinfo"><div class="rlabel">DESCANSO</div><div class="rtime" id="clock">01:30</div></div>
<button id="plus30" type="button">+30 s</button><button id="skipRest" type="button">Pular</button>
</div><nav class="tabs"><button data-v="today">Hoje</button><button data-v="workout">Treino</button><button data-v="history">Histórico</button><button data-v="evolution">Evolução</button></nav>
<script>
const W={A:[["Trap Bar Deadlift","3 × 8"],["Goblet Box Squat","3 × 10–12"],["Mesa Flexora","3 × 12"],["Remada Apoiada","3 × 10"],["Supino Inclinado com Halteres","3 × 10"],["Landmine Press","3 × 10/lado"],["Face Pull","3 × 15"],["Panturrilha Sentado","3 × 15"],["Panturrilha em Pé","3 × 12"],["Pallof Press","3 × 12/lado"],["Prancha","3 × 30–45 s"]],B:[["Step-Up Baixo","3 × 10/perna"],["Passada / Afundo","3 × 10/perna"],["RDL Unilateral","3 × 8/perna"],["Remada Baixa na Polia","3 × 10–12"],["Puxada Alta — Pegada Neutra","3 × 10–12"],["Elevação Lateral — Scaption","3 × 12"],["Rotação Externa","3 × 12/lado"],["Panturrilha Unilateral","3 × 12–15/perna"],["Farmer Walk","3 × 30–40 s"],["Dead Bug","3 × 10/lado"],["Apoio Unilateral","3 × 30 s/perna"]]};
let db,w=new Date().getDay()==5?'B':'A',sess={done:{},workout:w},timer,remain=90;const $=x=>document.getElementById(x);
function odb(){return new Promise((r,j)=>{let q=indexedDB.open("MeuTreino",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>j()})}
function put(k,v){return new Promise(r=>{let t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=r})}function get(k){return new Promise(r=>{let q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result)})}
function show(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));$(v).classList.add("active");if(v=="history")rh();if(v=="evolution")re()}
async function render(){ $("wt").textContent="Treino "+w;$("cards").innerHTML="";for(let i=0;i<W[w].length;i++){let e=W[w][i],l=await get("load_"+w+i)||"",s=sess.done[i]||[0,0,0],c=document.createElement("div");c.className="card";c.innerHTML=`<div class="ex">${i+1}. ${e[0]}</div><div class="muted">${e[1]}</div><a class="btn" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[0]+" exercício execução")}" style="margin:8px 0">Ver demonstração</a><div class="sets">${s.map((x,j)=>`<button data-s="${i},${j}" class="${x?"done":""}">${x?"Concluída":"Série "+(j+1)}</button>`).join("")}</div><div class="load"><input inputmode="decimal" value="${l}" data-l="${i}" placeholder="Carga em kg"><button data-save="${i}">Salvar</button></div><div class="saved">${l?"Última carga: "+l+" kg":"Sem carga registrada"}</div>`;$("cards").appendChild(c)}
document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{let i=+b.dataset.save,v=document.querySelector(`[data-l="${i}"]`).value.replace(",",".");await put("load_"+w+i,v);let h=await get("loads")||[];h.unshift({d:Date.now(),w,i,n:W[w][i][0],l:v});await put("loads",h);b.textContent="Salvo";setTimeout(()=>render(),500)});
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{let [i,j]=b.dataset.s.split(",").map(Number),s=sess.done[i]||[0,0,0];s[j]=!s[j];sess.done[i]=s;sess.workout=w;await put("session",sess);startTimer(90);render()});up()}
function up(){let n=Object.values(sess.done).flat().filter(Boolean).length,total=W[w].length*3;$("prog").textContent=`${n} de ${total} séries concluídas`;$("bar").style.width=n/total*100+"%"}
function hideRest(){clearInterval(timer);timer=null;$("restbar").classList.remove("show")}
function startTimer(x){clearInterval(timer);remain=x;$("restbar").classList.add("show");tick();timer=setInterval(()=>{remain--;tick();if(remain<=0){clearInterval(timer);timer=null;$("clock").textContent="00:00";setTimeout(()=>{$("restbar").classList.remove("show")},1200)}},1000)}
function tick(){$("clock").textContent=String(Math.floor(Math.max(0,remain)/60)).padStart(2,"0")+":"+String(Math.max(0,remain)%60).padStart(2,"0")}
async function rh(){let h=await get("sessions")||[];$("hist").innerHTML=h.length?h.map(x=>`<div class="hist"><b>Treino ${x.w}</b> · ${new Date(x.d).toLocaleDateString("pt-BR")}<br><span class="muted">${x.sets} séries</span></div>`).join(""):"Nenhum treino concluído."}
async function re(){let h=await get("loads")||[],a={};h.forEach(x=>{let k=x.w+x.i;if(!a[k])a[k]=x});$("evo").innerHTML=Object.values(a).map(x=>`<div class="card"><b>${x.n}</b><div style="font-size:25px;font-weight:900">${x.l} kg</div><div class="muted">Treino ${x.w} · ${new Date(x.d).toLocaleDateString("pt-BR")}</div></div>`).join("")||'<div class="card">Ainda sem cargas registradas.</div>'}
async function init(){await odb();$("date").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});let old=await get("session");if(old){sess=old;w=old.workout}$("suggest").textContent="Treino "+w;$("desc").textContent=w=="A"?"Força + estabilidade":"Unilateral + controle";await render();$("start").onclick=()=>show("workout");$("swap").onclick=async()=>{w=w=="A"?"B":"A";sess={done:{},workout:w};await put("session",sess);$("suggest").textContent="Treino "+w;render()};$("finish").onclick=async()=>{let h=await get("sessions")||[],sets=Object.values(sess.done).flat().filter(Boolean).length;h.unshift({d:Date.now(),w,sets});await put("sessions",h);await put("session",null);sess={done:{},workout:w};render();show("history")};document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>show(b.dataset.v));$("plus30").onclick=()=>{remain+=30;$("restbar").classList.add("show");tick()};$("skipRest").onclick=hideRest;[["sleep","sv"],["energy","ev"],["pain","pv"],["stiff","rv"]].forEach(([a,b])=>$(a).oninput=()=>{$(b).textContent=$(a).value;let p=+$("pain").value,sl=+$("sleep").value,en=+$("energy").value,st=+$("stiff").value;$("advice").textContent=p>=4?"Dor elevada: reduza carga/amplitude e não force o movimento doloroso.":sl<=5||en<=5||st>=6?"Recuperação abaixo do ideal: mantenha cargas ou reduza volume.":"Condição adequada para o treino planejado."})}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));init();
</script></body></html>
